name: Build and Release VCell Stochastic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create for the release (if not running on tag)'
        required: false
      release_name:
        description: 'Release name'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Export PYTHON_EXE (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "PYTHON_EXE=$(python -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV

      - name: Export PYTHON_EXE (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $py = & python -c "import sys; print(sys.executable)"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON_EXE=$py"

      - name: Set up environment - Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libhdf5-dev libhdf5-serial-dev libhdf5-cpp-103 libcurl4-openssl-dev zip

      - name: Set up environment - macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake hdf5 zip

      - name: Set up build environment (Windows) and install vcpkg
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y 7zip
          Write-Host "Cloning vcpkg into $env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          $vcpkgExe = "$env:RUNNER_TEMP\vcpkg\vcpkg.exe"
          & $vcpkgExe install hdf5:x64-windows
          if ($LASTEXITCODE -ne 0) { Write-Host "vcpkg install returned non-zero (continuing)" }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED=$env:RUNNER_TEMP\vcpkg\installed"

      - name: Configure (non-Windows) with Python bindings
        if: matrix.os != 'windows-latest'
        run: |
          echo "Using Python executable: $PYTHON_EXE"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON -DPYTHON_EXECUTABLE="$PYTHON_EXE"

      - name: Configure (Windows) using vcpkg toolchain (prefer config mode, forward slashes, HDF5 & Python hints)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_ROOT
          $vcpkgInstalled = Join-Path $vcpkgRoot 'installed'
          $instPrefix = Join-Path $vcpkgInstalled 'x64-windows'
          $vcpkgToolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          $hdf5Share = Join-Path $instPrefix 'share\hdf5'
          $hdf5Include = Join-Path $instPrefix 'include'
          $hdf5Lib = Join-Path $instPrefix 'lib'

          $instPrefixUnix = $instPrefix -replace '\\','/'
          $vcpkgToolchainUnix = $vcpkgToolchain -replace '\\','/'
          $hdf5ShareUnix = $hdf5Share -replace '\\','/'
          $hdf5IncludeUnix = $hdf5Include -replace '\\','/'
          $hdf5LibUnix = $hdf5Lib -replace '\\','/'

          Write-Host "Using vcpkg toolchain: $vcpkgToolchainUnix"
          if (-not (Test-Path $vcpkgToolchain)) {
            Write-Error "vcpkg toolchain not found at: $vcpkgToolchain"
            Exit 1
          }

          $pyExe = $env:PYTHON_EXE
          Write-Host "Using Python executable: $pyExe"

          $hdf5LibFile = "$hdf5LibUnix/hdf5.lib"
          Write-Host "Passing HDF5_LIBRARY hint: $hdf5LibFile"

          & cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchainUnix" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_PREFIX_PATH="$instPrefixUnix" `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=TRUE `
            -DBUILD_PYTHON_BINDINGS=ON `
            -DPYTHON_EXECUTABLE="$pyExe" `
            -DHDF5_ROOT="$instPrefixUnix" `
            -DHDF5_DIR="$hdf5ShareUnix" `
            -DHDF5_INCLUDE_DIRS="$hdf5IncludeUnix" `
            -DHDF5_INCLUDE_DIR="$hdf5IncludeUnix" `
            -DHDF5_LIBRARY="$hdf5LibFile" `
            -DHDF5_LIBRARIES="$hdf5LibFile"
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake configuration returned non-zero (continuing)" }

      - name: Build all (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --build build --config Release -- -j$(nproc || sysctl -n hw.ncpu)

      - name: Build all (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          & cmake --build build --config Release -- /m
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake build returned non-zero (continuing)" }

      - name: Detect and build Python binding targets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -eux
          echo "Listing CMake build targets (help):"
          cmake --build build --target help | tee build-targets.txt || true
          echo "Searching for targets that look like python bindings..."
          # Candidate keywords and fallback names:
          grep -Eio 'python|pybind|pywrap|pyext|vcell|bindings' build-targets.txt | sort -u > /tmp/py_keywords_found.txt || true
          TARGETS=$(grep -E '^[[:space:]]+[a-zA-Z0-9_:-]+' build-targets.txt | sed -E 's/^[[:space:]]+([a-zA-Z0-9_:-]+).*/\1/' | sort -u)
          echo "All targets (excerpt):"
          echo "$TARGETS" | sed -n '1,200p' || true
          TOBUILD=""
          # build any target whose name contains the keywords
          for t in $TARGETS; do
            lname=$(echo "$t" | tr '[:upper:]' '[:lower:]')
            if echo "$lname" | grep -E 'python|pybind|pywrap|pyext|vcell|bindings' >/dev/null; then
              TOBUILD="$TOBUILD $t"
            fi
          done
          if [ -z "$TOBUILD" ]; then
            echo "No python-like targets found; trying fallback common names..."
            FALLBACK="python python_bindings pybind VCellStochPython vcell_python vcellstoch_python bindings"
            for f in $FALLBACK; do
              if echo "$TARGETS" | grep -x "$f" >/dev/null; then
                TOBUILD="$TOBUILD $f"
              fi
            done
          fi
          if [ -n "$TOBUILD" ]; then
            echo "Building detected python-related targets: $TOBUILD"
            for t in $TOBUILD; do
              cmake --build build --config Release --target "$t" -- -j$(nproc || sysctl -n hw.ncpu) || true
            done
          else
            echo "No targets to build for Python bindings were detected."
          fi
          echo "Done detecting/building python targets."

      - name: Detect and build Python binding targets (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Listing CMake build targets (help)..."
          & cmake --build build --target help > build-targets.txt 2>&1
          Get-Content build-targets.txt | Select-Object -First 200 | ForEach-Object { Write-Host $_ }
          $targets = Get-Content build-targets.txt | ForEach-Object {
            if ($_ -match '^\s+([A-Za-z0-9_:-]+)') { $matches[1] }
          } | Sort-Object -Unique
          Write-Host "Extracted targets (excerpt):"
          $targets | Select-Object -First 200 | ForEach-Object { Write-Host $_ }
          $pyCandidates = $targets | Where-Object { $_ -match '(?i)python|pybind|pywrap|pyext|vcell|bindings' }
          if ($pyCandidates -and $pyCandidates.Count -gt 0) {
            Write-Host "Detected python-related targets: $($pyCandidates -join ', ')"
            foreach ($t in $pyCandidates) {
              Write-Host "Building target $t"
              & cmake --build build --config Release --target $t -- /m
              if ($LASTEXITCODE -ne 0) { Write-Host "Build of $t failed (continuing)" }
            }
          } else {
            Write-Host "No python-like targets found; trying fallback list..."
            $fallback = @('python','python_bindings','pybind','VCellStochPython','vcell_python','vcellstoch_python','bindings')
            foreach ($f in $fallback) {
              if ($targets -contains $f) {
                Write-Host "Building fallback target $f"
                & cmake --build build --config Release --target $f -- /m
                if ($LASTEXITCODE -ne 0) { Write-Host "Build of $f failed (continuing)" }
              }
            }
          }

      - name: Install (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          set -eux
          cmake --install build --prefix install || true
          echo "Install tree (excerpt):"
          if [ -d install ]; then ls -R install | sed -n '1,200p' || true; fi

      - name: Install (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          & cmake --install build --prefix install
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake --install returned non-zero (continuing)" }
          if (Test-Path install) { Get-ChildItem install -Recurse -Depth 2 | ForEach-Object { Write-Host $_.FullName } }

      - name: Collect Python artifacts (Unix) — build wheel if possible, copy extensions and installed site-packages
        if: matrix.os != 'windows-latest'
        run: |
          set -eux
          mkdir -p artifacts/python
          python -m pip install --upgrade pip setuptools wheel build || true
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "Attempting to build wheel via python -m build ..."
            python -m build --wheel --outdir dist || true
          fi
          # copy any wheels
          if [ -d dist ]; then
            find dist -type f -name "*.whl" -exec cp '{}' artifacts/python/ \; || true
            find dist -type f -not -name "*.whl" -exec cp '{}' artifacts/python/ \; || true
          fi
          # look for python install locations under install
          if [ -d install ]; then
            find install -type f \( -path '*/site-packages/*' -o -name '*.py' -o -name '*.so' -o -name '*.pyd' -o -name '*.dylib' -o -name '*.dll' \) -exec cp --parents '{}' artifacts/python/ \; || true
          fi
          # scan build tree for extension modules
          find build -type f \( -name '*.so' -o -name '*.pyd' -o -name '*.dylib' -o -name '*.dll' \) -exec cp --parents '{}' artifacts/python/ \; || true
          echo "Collected Python artifacts (artifacts/python):"
          if [ -d artifacts/python ]; then ls -R artifacts/python || true; else echo "artifacts/python missing"; fi

      - name: Collect Python artifacts (Windows) — build wheel if possible, copy extensions and installed site-packages
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Path artifacts\python -Force | Out-Null
          & python -m pip install --upgrade pip setuptools wheel build
          if ($LASTEXITCODE -ne 0) { Write-Host "pip install build tools returned non-zero (continuing)" }
          if (Test-Path pyproject.toml -or Test-Path setup.py) {
            Write-Host "Attempting to build wheel via python -m build ..."
            & python -m build --wheel --outdir dist
            if ($LASTEXITCODE -ne 0) { Write-Host "python -m build failed (continuing)" }
          }
          if (Test-Path dist) {
            Get-ChildItem -Path dist -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination artifacts\python -Force -ErrorAction SilentlyContinue
            }
          }
          if (Test-Path install) {
            Get-ChildItem -Path install -Recurse -Include '*site-packages*','*.py','*.pyd','*.so','*.dll','*.dylib' -File -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination artifacts\python -Force -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem -Path build -Recurse -Include *.pyd,*.dll,*.so,*.dylib -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination artifacts\python -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Collected Python artifacts (artifacts\\python):"
          if (Test-Path artifacts\python) {
            Get-ChildItem artifacts\python -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No python artifacts found"
          }

      - name: Collect build outputs (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          if [ -d build/bin ]; then
            cp -r build/bin artifacts/ || true
          fi

      - name: Collect build outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (Test-Path build\bin) {
            Copy-Item -Path build\bin\* -Destination artifacts -Recurse -Force
          }

      - name: Package artifacts (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          zip -r vcell-stoch-${{ matrix.os }}.zip artifacts -x "**/.git/**" || true

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $out = "vcell-stoch-${{ matrix.os }}.zip"
          if (Test-Path artifacts) {
            Compress-Archive -Path artifacts\* -DestinationPath $out -Force
          } else {
            New-Item -Path $out -ItemType File | Out-Null
          }

      - name: Upload job artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcell-stoch-${{ matrix.os }}
          path: |
            vcell-stoch-${{ matrix.os }}.zip
            artifacts

  create_release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-ubuntu-22.04
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-macos-latest
          path: ./artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-windows-latest
          path: ./artifacts/windows

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=ci-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name || steps.tag.outputs.tag_name }}
          body: "Automated build artifacts for ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-platform zip assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/vcell-stoch-ubuntu-22.04.zip
          asset_name: vcell-stoch-ubuntu-22.04.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/vcell-stoch-macos-latest.zip
          asset_name: vcell-stoch-macos-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/vcell-stoch-windows-latest.zip
          asset_name: vcell-stoch-windows-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Python artifacts (wheels / modules) as individual release assets if present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -e
          upload() {
            local file="$1"
            local fname
            fname=$(basename "$file")
            echo "Uploading $file as $fname"
            base_upload_url="${UPLOAD_URL%\{*}"
            curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$file" "$base_upload_url?name=$fname" || { echo "Upload failed for $file"; exit 1; }
          }
          for f in ./artifacts/*/python/* ./artifacts/*/dist/* ./artifacts/*/*.whl; do
            if [ -f "$f" ]; then
              upload "$f"
            fi
          done || true
