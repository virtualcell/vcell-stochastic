name: Build and Release VCell Stochastic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create for the release (if not running on tag)'
        required: false
      release_name:
        description: 'Release name'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Export PYTHON_EXE (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "PYTHON_EXE=$(python -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV

      - name: Export PYTHON_EXE (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $py = & python -c "import sys; print(sys.executable)"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON_EXE=$py"

      - name: Set up environment - Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libhdf5-dev libhdf5-serial-dev libhdf5-cpp-103 libcurl4-openssl-dev zip

      - name: Set up environment - macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake hdf5 zip

      - name: Set up build environment (Windows) and install vcpkg
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install -y 7zip
          Write-Host "Cloning vcpkg into $env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          $vcpkgExe = "$env:RUNNER_TEMP\vcpkg\vcpkg.exe"
          
          # Added [cpp] here so vcpkg builds the C++ headers your CMakeLists.txt needs
          & $vcpkgExe install hdf5[core,cpp]:x64-windows pybind11:x64-windows
          
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED=$env:RUNNER_TEMP\vcpkg\installed"

      - name: Configure (non-Windows) with Python bindings
        if: matrix.os != 'windows-latest'
        run: |
          echo "Using Python executable: $PYTHON_EXE"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPTION_BUILD_PYTHON_BINDINGS=ON -DPYTHON_EXECUTABLE="$PYTHON_EXE"

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_ROOT
          $instPrefix = "$vcpkgRoot/installed/x64-windows" -replace '\\','/'
          $vcpkgToolchain = "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" -replace '\\','/'
          
          # Force Python paths for the old-style find_package(PythonLibs) in your CMakeLists.txt
          $pyRoot = $env:pythonLocation -replace '\\','/'
          $pyInclude = "$pyRoot/include"
          $pyLib = "$pyRoot/libs/python310.lib"

          & cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_PREFIX_PATH="$instPrefix" `
            -DHDF5_ROOT="$instPrefix" `
            -DPYTHON_EXECUTABLE="$($env:PYTHON_EXE -replace '\\','/')" `
            -DPYTHON_INCLUDE_DIR="$pyInclude" `
            -DPYTHON_LIBRARY="$pyLib" `
            -DOPTION_BUILD_PYTHON_BINDINGS=ON

          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --build build --config Release -- -j$(nproc || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & cmake --build build --config Release -- /m
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake build returned non-zero (continuing)" }

      - name: Detect and build Python binding targets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -eux
          cmake --build build --target help > build-targets.txt 2>&1 || true
          TARGETS=$(awk '/^[[:space:]]+[A-Za-z0-9_:-]+/ { sub(/^[[:space:]]+/,""); print $1 }' build-targets.txt | sort -u || true)
          echo "Targets detected (excerpt):"
          echo "$TARGETS" | sed -n '1,200p' || true
          TOBUILD=""
          for t in $TARGETS; do
            lname=$(echo "$t" | tr '[:upper:]' '[:lower:]')
            if echo "$lname" | grep -E 'python|pybind|pywrap|pyext|vcell|bindings' >/dev/null; then
              TOBUILD="$TOBUILD $t"
            fi
          done
          if [ -z "$TOBUILD" ]; then
            echo "No python-like targets detected. Attempting common fallback list..."
            FALLBACK="python python_bindings pybind VCellStochPython vcell_python vcellstoch_python bindings"
            for f in $FALLBACK; do
              if echo "$TARGETS" | grep -x "$f" >/dev/null; then
                TOBUILD="$TOBUILD $f"
              fi
            done
          fi
          if [ -n "$TOBUILD" ]; then
            echo "Building python-related targets: $TOBUILD"
            for t in $TOBUILD; do
              echo "Building target: $t"
              cmake --build build --config Release --target "$t" -- -j$(nproc || sysctl -n hw.ncpu) || true
            done
          else
            echo "No python targets to build."
          fi

      - name: Detect and build Python binding targets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The Visual Studio generator does not support --target help.
          # ALL_BUILD (already run in the Build step) compiles everything including
          # pybind targets. Nothing to do here.
          Write-Host "Visual Studio generator builds all targets via ALL_BUILD (already done). Skipping target detection."

      - name: Install pytest and requirements (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest || true
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt || true; fi

      - name: Install pytest and requirements (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & python -m pip install --upgrade pip
          & python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { Write-Host "pytest install failed (continuing)" }

      - name: Run Python tests (Unix) - pytest if present otherwise import smoke test
        if: matrix.os != 'windows-latest'
        run: |
          if [ -d Tests/python ]; then
            python -m pytest Tests/python -q || true
          else
            printf '%s\n' "import sys, importlib, traceback" "sys.path.insert(0, 'build')" "try:" "    import VCellStoch" "    print('VCellStoch import OK')" "except Exception:" "    traceback.print_exc()" "    sys.exit(1)" > import_test.py
            python import_test.py || true
          fi

      - name: Run Python tests (Windows) - pytest if present otherwise import smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path Tests\python) {
            & python -m pytest Tests\python -q
            if ($LASTEXITCODE -ne 0) { Write-Host "pytest returned non-zero (continuing)" }
          } else {
            $lines = @(
              "import sys, importlib, traceback"
              "sys.path.insert(0, 'build')"
              "try:"
              "    import VCellStoch"
              "    print('VCellStoch import OK')"
              "except Exception:"
              "    traceback.print_exc()"
              "    sys.exit(1)"
            )
            $lines | Out-File -FilePath import_test.py -Encoding utf8
            & python import_test.py
            if ($LASTEXITCODE -ne 0) { Write-Host "import smoke test returned non-zero (continuing)" }
          }

      - name: Collect Python artifacts (Unix) — copy built extensions and wheels from build/dist
        if: matrix.os != 'windows-latest'
        run: |
          set -eux
          mkdir -p artifacts/python
          if [ -d dist ]; then
            find dist -type f -name "*.whl" -exec cp '{}' artifacts/python/ \; || true
            find dist -type f -not -name "*.whl" -exec cp '{}' artifacts/python/ \; || true
          fi
          find build -type f \( -iname "*.so" -o -iname "*.dylib" -o -iname "*.pyd" -o -iname "*.dll" \) -exec cp '{}' artifacts/python/ \; || true
          echo "Collected Python artifacts (Unix):"
          ls -R artifacts/python || true

      - name: Collect Python artifacts (Windows) — copy built extensions and wheels from build/dist
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Path artifacts\python -Force | Out-Null
          if (Test-Path dist) {
            Get-ChildItem -Path dist -File -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName -Destination artifacts\python -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem -Path build -Recurse -Include *.pyd,*.dll,*.so,*.dylib -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination artifacts\python -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Collected Python artifacts (Windows):"
          if (Test-Path artifacts\python) { Get-ChildItem artifacts\python -Recurse -Force | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No python artifacts found" }

      - name: Collect build outputs (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          if [ -d build/bin ]; then
            cp -r build/bin artifacts/ || true
          fi
          if [ -d build/lib ]; then
            cp -r build/lib artifacts/ || true
          fi

      - name: Collect build outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (Test-Path build\bin) { Copy-Item -Path build\bin\* -Destination artifacts -Recurse -Force }
          if (Test-Path build\lib) { Copy-Item -Path build\lib\* -Destination artifacts -Recurse -Force }

      - name: Package artifacts (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          zip -r vcell-stoch-${{ matrix.os }}.zip artifacts -x "**/.git/**" || true

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $out = "vcell-stoch-${{ matrix.os }}.zip"
          if (Test-Path artifacts) {
            & 7z a -tzip $out artifacts\ | Out-Null
          } else {
            New-Item -Path $out -ItemType File | Out-Null
          }

      - name: Upload job artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcell-stoch-${{ matrix.os }}
          path: |
            vcell-stoch-${{ matrix.os }}.zip
            artifacts

  create_release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-ubuntu-22.04
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-macos-latest
          path: ./artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-windows-latest
          path: ./artifacts/windows

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=ci-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name || steps.tag.outputs.tag_name }}
          body: "Automated build artifacts for ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-platform zip assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/vcell-stoch-ubuntu-22.04.zip
          asset_name: vcell-stoch-ubuntu-22.04.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/vcell-stoch-macos-latest.zip
          asset_name: vcell-stoch-macos-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/vcell-stoch-windows-latest.zip
          asset_name: vcell-stoch-windows-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Python artifacts (wheels / modules) as individual release assets if present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -e
          upload() {
            local file="$1"
            local fname
            fname=$(basename "$file")
            echo "Uploading $file as $fname"
            base_upload_url="${UPLOAD_URL%\{*}"
            curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$file" "$base_upload_url?name=$fname" || { echo "Upload failed for $file"; }
          }
          for f in ./artifacts/*/python/* ./artifacts/*/dist/* ./artifacts/*/*.whl; do
            if [ -f "$f" ]; then
              upload "$f"
            fi
          done || true
