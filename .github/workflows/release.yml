name: Build and Release VCell Stochastic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create for the release (if not running on tag)'
        required: false
      release_name:
        description: 'Release name'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Export PYTHON_EXE (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "PYTHON_EXE=$(python -c 'import sys; print(sys.executable)')" >> $GITHUB_ENV

      - name: Export PYTHON_EXE (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $py = & python -c "import sys; print(sys.executable)"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON_EXE=$py"

      - name: Set up environment - Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libhdf5-dev libhdf5-serial-dev libhdf5-cpp-103 libcurl4-openssl-dev zip

      - name: Set up environment - macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake hdf5 zip

      - name: Set up build environment (Windows) and install vcpkg
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y 7zip
          Write-Host "Cloning vcpkg into $env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          $vcpkgExe = "$env:RUNNER_TEMP\vcpkg\vcpkg.exe"
          # If bindings require C++ API, consider: & $vcpkgExe install "hdf5[cxx]:x64-windows"
          & $vcpkgExe install hdf5:x64-windows
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED=$env:RUNNER_TEMP\vcpkg\installed"

      - name: Configure (non-Windows) with Python bindings
        if: matrix.os != 'windows-latest'
        run: |
          echo "Using Python executable: $PYTHON_EXE"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON -DPYTHON_EXECUTABLE="$PYTHON_EXE"

      - name: Configure (Windows) using vcpkg toolchain (prefer config mode, forward slashes, HDF5 & Python hints)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_ROOT
          $vcpkgInstalled = Join-Path $vcpkgRoot 'installed'
          $instPrefix = Join-Path $vcpkgInstalled 'x64-windows'
          $vcpkgToolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          $hdf5Share = Join-Path $instPrefix 'share\hdf5'
          $hdf5Include = Join-Path $instPrefix 'include'
          $hdf5Lib = Join-Path $instPrefix 'lib'

          # Convert backslashes to forward slashes to avoid CMake escaping issues
          $instPrefixUnix = $instPrefix -replace '\\','/'
          $vcpkgToolchainUnix = $vcpkgToolchain -replace '\\','/'
          $hdf5ShareUnix = $hdf5Share -replace '\\','/'
          $hdf5IncludeUnix = $hdf5Include -replace '\\','/'
          $hdf5LibUnix = $hdf5Lib -replace '\\','/'

          Write-Host "Using vcpkg toolchain: $vcpkgToolchainUnix"
          Write-Host "vcpkg installed prefix (unix-style): $instPrefixUnix"
          if (-not (Test-Path $vcpkgToolchain)) {
            Write-Error "vcpkg toolchain not found at: $vcpkgToolchain"
            Exit 1
          }

          Write-Host "Listing vcpkg installed hdf5-related files (if present):"
          if (Test-Path $hdf5Share) { Get-ChildItem -Path $hdf5Share -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Share" }
          if (Test-Path $hdf5Include) { Get-ChildItem -Path $hdf5Include -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Include" }
          if (Test-Path $hdf5Lib) { Get-ChildItem -Path $hdf5Lib -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Lib" }

          if (Test-Path (Join-Path $hdf5Share 'vcpkg-cmake-wrapper.cmake')) {
            Write-Host "vcpkg-cmake-wrapper.cmake contents:"
            Get-Content (Join-Path $hdf5Share 'vcpkg-cmake-wrapper.cmake') | ForEach-Object { Write-Host $_ }
          }

          $pyExe = $env:PYTHON_EXE
          Write-Host "Using Python executable: $pyExe"

          $hdf5LibFile = "$hdf5LibUnix/hdf5.lib"
          Write-Host "Passing HDF5_LIBRARY hint: $hdf5LibFile"

          # Single-line cmake call so PowerShell parsing is safe
          & cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchainUnix" -DVCPKG_TARGET_TRIPLET="x64-windows" -DCMAKE_PREFIX_PATH="$instPrefixUnix" -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=TRUE -DBUILD_PYTHON_BINDINGS=ON -DPYTHON_EXECUTABLE="$pyExe" -DHDF5_ROOT="$instPrefixUnix" -DHDF5_DIR="$hdf5ShareUnix" -DHDF5_INCLUDE_DIRS="$hdf5IncludeUnix" -DHDF5_INCLUDE_DIR="$hdf5IncludeUnix" -DHDF5_LIBRARY="$hdf5LibFile" -DHDF5_LIBRARIES="$hdf5LibFile"

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --build build --config Release -- -j$(nproc || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          & cmake --build build --config Release -- /m

      - name: Install pytest and requirements (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest || true
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt || true; fi

      - name: Install pytest and requirements (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          & python -m pip install --upgrade pip
          & python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { Write-Host "pytest install failed (continuing)" }

      - name: Run Python tests (Unix) - pytest if present otherwise import smoke test
        if: matrix.os != 'windows-latest'
        run: |
          if [ -d Tests/python ]; then
            echo "Running python pytest tests..."
            python -m pytest Tests/python -q || true
          else
            echo "No Tests/python directory found; running import smoke test"
            printf '%s\n' "import sys, importlib, traceback" "sys.path.insert(0, 'build')" "try:" "    import VCellStoch" "    print('VCellStoch import OK')" "except Exception:" "    traceback.print_exc()" "    sys.exit(1)" > import_test.py
            python import_test.py
          fi

      - name: Run Python tests (Windows) - pytest if present otherwise import smoke test
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path Tests\python) {
            Write-Host "Running python pytest tests..."
            & python -m pytest Tests\python -q
            if ($LASTEXITCODE -ne 0) { Write-Host "pytest returned non-zero (continuing)" }
          } else {
            Write-Host "No Tests/python directory found; running import smoke test"
            $lines = @(
              "import sys, importlib, traceback"
              "sys.path.insert(0, 'build')"
              "try:"
              "    import VCellStoch"
              "    print('VCellStoch import OK')"
              "except Exception:"
              "    traceback.print_exc()"
              "    sys.exit(1)"
            )
            $lines | Out-File -FilePath import_test.py -Encoding utf8
            & python import_test.py
          }

      # Collect python artifacts explicitly (wheels or extension modules) into artifacts/python
      - name: Collect Python artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts/python
          # copy wheels if present
          if [ -d dist ]; then cp -r dist/* artifacts/python/ || true; fi
          # collect common extension filenames (.so/.pyd/.dll) from build tree
          find build -type f \( -name "*.so" -o -name "*.pyd" -o -name "*.dll" -o -name "*.dylib" \) -exec cp --parents '{}' artifacts/python/ \; || true

      - name: Collect Python artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts\python -Force | Out-Null
          if (Test-Path dist) { Copy-Item -Path dist\* -Destination artifacts\python -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem -Path build -Recurse -Include *.pyd,*.dll,*.so,*.dylib -File -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path $PWD 'artifacts\python'
            Copy-Item -Path $_.FullName -Destination $dest -Force
          }

      - name: Collect build outputs (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          if [ -d build/bin ]; then
            cp -r build/bin artifacts/ || true
          fi
          # python artifacts are already copied into artifacts/python above

      - name: Collect build outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (Test-Path build\bin) {
            Copy-Item -Path build\bin\* -Destination artifacts -Recurse -Force
          }
          # python artifacts are already copied into artifacts\python above

      - name: Package artifacts (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          zip -r vcell-stoch-${{ matrix.os }}.zip artifacts -x "**/.git/**" || true

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $out = "vcell-stoch-${{ matrix.os }}.zip"
          if (Test-Path artifacts) {
            Compress-Archive -Path artifacts\* -DestinationPath $out -Force
          } else {
            New-Item -Path $out -ItemType File | Out-Null
          }

      - name: Upload job artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcell-stoch-${{ matrix.os }}
          path: |
            vcell-stoch-${{ matrix.os }}.zip
            artifacts

  create_release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-ubuntu-22.04
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-macos-latest
          path: ./artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-windows-latest
          path: ./artifacts/windows

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=ci-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name || steps.tag.outputs.tag_name }}
          body: "Automated build artifacts for ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-platform zip assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/vcell-stoch-ubuntu-22.04.zip
          asset_name: vcell-stoch-ubuntu-22.04.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/vcell-stoch-macos-latest.zip
          asset_name: vcell-stoch-macos-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/vcell-stoch-windows-latest.zip
          asset_name: vcell-stoch-windows-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Python artifacts (wheels / modules) as individual release assets if present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -e
          upload() {
            local file="$1"
            local fname
            fname=$(basename "$file")
            echo "Uploading $file as $fname"
            # upload_url includes {?name,label}; remove the template if present
            base_upload_url="${UPLOAD_URL%\{*}"
            curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$file" "$base_upload_url?name=$fname" || { echo "Upload failed for $file"; exit 1; }
          }

          # find wheel files and other python artifacts under artifacts/*/python and upload them
          for f in ./artifacts/*/python/* ./artifacts/*/dist/* ./artifacts/*/*.whl; do
            if [ -f "$f" ]; then
              upload "$f"
            fi
          done || true
