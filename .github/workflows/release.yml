name: Build and Release VCell Stochastic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create for the release (if not running on tag)'
        required: false
      release_name:
        description: 'Release name'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment - Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libhdf5-dev libhdf5-serial-dev libhdf5-cpp-103 libcurl4-openssl-dev zip

      - name: Set up environment - macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake hdf5 zip

      - name: Set up build environment (Windows) and install vcpkg
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y 7zip
          Write-Host "Cloning vcpkg into $env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          $vcpkgExe = "$env:RUNNER_TEMP\vcpkg\vcpkg.exe"
          # install base hdf5 port; add features if your project needs them (e.g. hdf5[cxx])
          & $vcpkgExe install hdf5:x64-windows
          echo "VCPKG_ROOT=$env:RUNNER_TEMP\\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLED=$env:RUNNER_TEMP\\vcpkg\\installed" >> $env:GITHUB_ENV

      - name: Configure (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows) using vcpkg toolchain (convert paths to forward slashes and pass HDF5 hints)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_ROOT
          $vcpkgInstalled = Join-Path $vcpkgRoot 'installed'
          $instPrefix = Join-Path $vcpkgInstalled 'x64-windows'
          $vcpkgToolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          $hdf5Share = Join-Path $instPrefix 'share\hdf5'
          $hdf5Include = Join-Path $instPrefix 'include'
          $hdf5Lib = Join-Path $instPrefix 'lib'

          # convert Windows backslashes to forward slashes to avoid CMake escape problems
          $instPrefixUnix = $instPrefix -replace '\\','/'
          $vcpkgToolchainUnix = $vcpkgToolchain -replace '\\','/'
          $hdf5ShareUnix = $hdf5Share -replace '\\','/'
          $hdf5IncludeUnix = $hdf5Include -replace '\\','/'
          $hdf5LibUnix = $hdf5Lib -replace '\\','/'

          Write-Host "Using vcpkg toolchain: $vcpkgToolchainUnix"
          Write-Host "vcpkg installed prefix (unix style): $instPrefixUnix"
          if (-not (Test-Path $vcpkgToolchain)) {
            Write-Error "vcpkg toolchain not found at: $vcpkgToolchain"
            Exit 1
          }

          Write-Host "Listing vcpkg installed hdf5-related files (if present):"
          if (Test-Path $hdf5Share) { Get-ChildItem -Path $hdf5Share -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Share" }
          if (Test-Path $hdf5Include) { Get-ChildItem -Path $hdf5Include -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Include" }
          if (Test-Path $hdf5Lib) { Get-ChildItem -Path $hdf5Lib -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Lib" }

          if (Test-Path (Join-Path $hdf5Share 'vcpkg-cmake-wrapper.cmake')) {
            Write-Host "vcpkg-cmake-wrapper.cmake contents:"
            Get-Content (Join-Path $hdf5Share 'vcpkg-cmake-wrapper.cmake') | ForEach-Object { Write-Host $_ }
          }

          # Provide CMAKE_PREFIX_PATH so config packages under the vcpkg prefix are found,
          # and pass explicit module-mode hints (include dir + library) to FindHDF5 if needed.
          $hdf5LibFile = "$hdf5LibUnix/hdf5.lib"
          Write-Host "Passing HDF5_LIBRARY hint: $hdf5LibFile"

          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchainUnix" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_PREFIX_PATH="$instPrefixUnix" `
            -DHDF5_ROOT="$instPrefixUnix" `
            -DHDF5_DIR="$hdf5ShareUnix" `
            -DHDF5_INCLUDE_DIRS="$hdf5IncludeUnix" `
            -DHDF5_INCLUDE_DIR="$hdf5IncludeUnix" `
            -DHDF5_LIBRARY="$hdf5LibFile"

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --build build --config Release -- -j$(nproc || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cmake --build build --config Release -- /m

      - name: Run tests (non-Windows) - best-effort
        if: matrix.os != 'windows-latest'
        run: |
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --verbose || true
          fi

      - name: Collect build outputs (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          if [ -d build/bin ]; then
            cp -r build/bin artifacts/ || true
          fi

      - name: Collect build outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (Test-Path build\bin) {
            Copy-Item -Path build\bin\* -Destination artifacts -Recurse -Force
          }

      - name: Package artifacts (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          zip -r vcell-stoch-${{ matrix.os }}.zip artifacts -x "**/.git/**" || true

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $out = "vcell-stoch-${{ matrix.os }}.zip"
          if (Test-Path artifacts) {
            Compress-Archive -Path artifacts\* -DestinationPath $out -Force
          } else {
            New-Item -Path $out -ItemType File | Out-Null
          }

      - name: Upload job artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcell-stoch-${{ matrix.os }}
          path: |
            vcell-stoch-${{ matrix.os }}.zip
            artifacts

  create_release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-ubuntu-22.04
          path: ./artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-macos-latest
          path: ./artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vcell-stoch-windows-latest
          path: ./artifacts/windows

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=ci-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name || steps.tag.outputs.tag_name }}
          body: "Automated build artifacts for ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux asset
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/linux/vcell-stoch-ubuntu-22.04.zip
          asset_name: vcell-stoch-ubuntu-22.04.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS asset
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/macos/vcell-stoch-macos-latest.zip
          asset_name: vcell-stoch-macos-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows asset
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/windows/vcell-stoch-windows-latest.zip
          asset_name: vcell-stoch-windows-latest.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
