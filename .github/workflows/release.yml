name: Build and Release VCell Stochastic

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to create for the release (if not running on tag)'
        required: false
      release_name:
        description: 'Release name'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment - Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libhdf5-dev libhdf5-serial-dev libhdf5-cpp-103 libcurl4-openssl-dev zip

      - name: Set up environment - macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake hdf5 zip

      - name: Set up build environment (Windows) and install vcpkg
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y 7zip
          Write-Host "Cloning vcpkg into $env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          $vcpkgExe = "$env:RUNNER_TEMP\vcpkg\vcpkg.exe"
          # If your project needs C++ wrappers/features, consider e.g. hdf5[cxx]:x64-windows
          & $vcpkgExe install hdf5:x64-windows
          echo "VCPKG_ROOT=$env:RUNNER_TEMP\\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLED=$env:RUNNER_TEMP\\vcpkg\\installed" >> $env:GITHUB_ENV

      - name: Configure (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows) using vcpkg toolchain (prefer config mode, forward slashes, HDF5 hints)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_ROOT
          $vcpkgInstalled = Join-Path $vcpkgRoot 'installed'
          $instPrefix = Join-Path $vcpkgInstalled 'x64-windows'
          $vcpkgToolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          $hdf5Share = Join-Path $instPrefix 'share\hdf5'
          $hdf5Include = Join-Path $instPrefix 'include'
          $hdf5Lib = Join-Path $instPrefix 'lib'

          # convert backslashes to forward slashes to avoid CMake escaping issues
          $instPrefixUnix = $instPrefix -replace '\\','/'
          $vcpkgToolchainUnix = $vcpkgToolchain -replace '\\','/'
          $hdf5ShareUnix = $hdf5Share -replace '\\','/'
          $hdf5IncludeUnix = $hdf5Include -replace '\\','/'
          $hdf5LibUnix = $hdf5Lib -replace '\\','/'

          Write-Host "Using vcpkg toolchain: $vcpkgToolchainUnix"
          Write-Host "vcpkg installed prefix (unix-style): $instPrefixUnix"
          if (-not (Test-Path $vcpkgToolchain)) {
            Write-Error "vcpkg toolchain not found at: $vcpkgToolchain"
            Exit 1
          }

          Write-Host "Listing vcpkg installed hdf5-related files (if present):"
          if (Test-Path $hdf5Share) { Get-ChildItem -Path $hdf5Share -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Share" }
          if (Test-Path $hdf5Include) { Get-ChildItem -Path $hdf5Include -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Include" }
          if (Test-Path $hdf5Lib) { Get-ChildItem -Path $hdf5Lib -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "No $hdf5Lib" }

          if (Test-Path (Join-Path $hdf5Share 'vcpkg-cmake-wrapper.cmake')) {
            Write-Host "vcpkg-cmake-wrapper.cmake contents:"
            Get-Content (Join-Path $hdf5Share 'vcpkg-cmake-wrapper.cmake') | ForEach-Object { Write-Host $_ }
          }

          # Hints to help CMake find HDF5:
          $hdf5LibFile = "$hdf5LibUnix/hdf5.lib"
          Write-Host "Passing HDF5_LIBRARY hint: $hdf5LibFile"

          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchainUnix" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DCMAKE_PREFIX_PATH="$instPrefixUnix" `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=TRUE `
            -DHDF5_ROOT="$instPrefixUnix" `
            -DHDF5_DIR="$hdf5ShareUnix" `
            -DHDF5_INCLUDE_DIRS="$hdf5IncludeUnix" `
            -DHDF5_INCLUDE_DIR="$hdf5IncludeUnix" `
            -DHDF5_LIBRARY="$hdf5LibFile" `
            -DHDF5_LIBRARIES="$hdf5LibFile"

      - name: Build (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          cmake --build build --config Release -- -j$(nproc || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cmake --build build --config Release -- /m

      - name: Run tests (non-Windows) - best-effort
        if: matrix.os != 'windows-latest'
        run: |
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --verbose || true
          fi

      - name: Collect build outputs (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          if [ -d build/bin ]; then
            cp -r build/bin artifacts/ || true
          fi

      - name: Collect build outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts -](#)`
